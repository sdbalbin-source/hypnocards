    <style>
        /* --- Core Styles --- */
        :root {
            --primary-bg: #000000;
            --card-glass: rgba(20, 20, 25, 0.95);
            --border-glass: rgba(255, 255, 255, 0.15);
        }

        body {   
            font-family: 'DM Mono', monospace;
            background-color: var(--primary-bg);   
            color: #e0e0e0;   
            overflow: hidden;   
            user-select: none;   
            -webkit-tap-highlight-color: transparent;   
        }
        .serif-font { font-family: 'Cormorant Garamond', serif; }
        
        /* --- Hypnotic Spiral Background --- */
        .hypno-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: -2;
            background: #000;
        }

        .hypno-spiral {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150vmax;
            height: 150vmax;
            transform-origin: center;
            transform: translate(-50%, -50%);
            animation: spinSpiral 15s linear infinite;
            opacity: 0.6;
        }

        @keyframes spinSpiral {   
            from { transform: translate(-50%, -50%) rotate(0deg); }   
            to { transform: translate(-50%, -50%) rotate(360deg); }   
        }
        
        /* Vignette */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, black 85%);
            pointer-events: none;
            z-index: -1;
        }

        /* UI Elements */
        .glass-panel {
            background: var(--card-glass);   
            backdrop-filter: blur(20px);   
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);   
            box-shadow: 0 15px 50px 0 rgba(0, 0, 0, 0.8);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        button.glass-panel:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 15px 50px 0 rgba(0,0,0,0.8), 0 0 30px rgba(147, 51, 234, 0.15);
        }

        /* Card Styles */
        .card-container { perspective: 1000px; width: 100%; height: 100%; position: relative; }
        .card-inner {   
            width: 100%; height: 100%; position: relative;   
            transition: transform 0.55s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;   
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1.5rem;   
            display: flex; flex-direction: column;   
            overflow: hidden;   
        }
        .card-face-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: rotateY(180deg);
            border-radius: 1.5rem;
            display: flex; flex-direction: column;
            overflow: hidden;
            background: rgba(20,10,40,0.97);
            border: 4px solid #a855f7;
            box-shadow: 0 15px 50px 0 rgba(0,0,0,0.8);
        }

        /* Info button */
        .info-btn {
            position: absolute; top: 12px; right: 12px; z-index: 50;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.5);
            font-family: 'DM Mono', monospace;
            font-size: 13px; font-style: italic; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .info-btn:hover { background: rgba(168,85,247,0.2); border-color: rgba(168,85,247,0.6); color: #c084fc; }
        
        /* Sticky Header */
        .card-header-fixed {
            flex: 0 0 auto;   
            padding: 2.5rem 1.5rem 1.5rem 1.5rem;   
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        /* Scroll Area */
        .card-scroll-area {
            flex: 1 1 auto;   
            min-height: 0;
            overflow-y: auto;   
            overflow-x: hidden;
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        
        .card-content-wrapper {
            margin: auto 0;
            width: 100%;
        }
        
        /* Sticky Footer */
        .card-footer-fixed {
            flex: 0 0 auto;
            padding: 1rem;
            background: rgba(0,0,0,0.6);
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        /* Custom Scrollbar */
        .card-scroll-area::-webkit-scrollbar { width: 4px; }
        .card-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .card-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Card content bold highlight */
        .card-content-text strong {
            font-style: italic;
            color: #c9a96e;
            font-weight: 700;
        }

        /* Animations */
        .slide-out-left { animation: slideOutLeft 0.3s forwards; }
        .slide-in-right { animation: slideInRight 0.3s forwards; }
        .slide-out-right { animation: slideOutRight 0.3s forwards; }
        .slide-in-left { animation: slideInLeft 0.3s forwards; }
        
        @keyframes slideOutLeft { to { transform: translateX(-60px) rotate(-5deg); opacity: 0; } }
        @keyframes slideInRight { from { transform: translateX(60px) rotate(5deg); opacity: 0; } to { transform: translateX(0) rotate(0); opacity: 1; } }
        @keyframes slideOutRight { to { transform: translateX(60px) rotate(5deg); opacity: 0; } }
        @keyframes slideInLeft { from { transform: translateX(-60px) rotate(-5deg); opacity: 0; } to { transform: translateX(0) rotate(0); opacity: 1; } }

        /* Carousel items */
        .carousel-item {
            flex: 0 0 auto;
            transition: all 0.3s ease; opacity: 0.45; transform: scale(0.88);
            padding: 0.4rem 1rem; border-radius: 9999px; font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.1); cursor: pointer; color: white; white-space: nowrap;
            font-family: 'DM Mono', monospace;
            user-select: none;
        }
        .carousel-item:hover { opacity: 0.75; }
        .carousel-item.active {
            opacity: 1; transform: scale(1.05);
            border-color: currentColor; background: rgba(255,255,255,0.1);
            font-weight: bold; box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }

        /* Card side nav arrows */
        .card-nav-arrow { transition: color 0.2s; }
        .card-nav-arrow:hover i { color: rgba(255,255,255,0.7) !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .recording-pulse { animation: pulseRed 1.5s infinite; color: #ef4444; border-color: #ef4444; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .mask-linear { mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); }

tion Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Just like water fills a vessel, let this sensation fill you. From the tips of your toes to the top of your head, until you are saturated, until it's impossible to hold any more, until it overflows."}, {"id": "168", "pattern": "Magnetic pull", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "You are drawn to it. It’s natural, it’s strong, it’s inevitable. Like a sponge absorbing water, your nervous system is absorbing this sensation, locking it into your identity."}, {"id": "169", "pattern": "The recursive loop", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Relaxing deeper into the moment. Every moment is a moment to relax. You relax into the moment. You expand into the breath, you connect to the soul, everything connects into one, over and over again."}, {"id": "170", "pattern": "The evolution pattern", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Floating, flowing, drifting, dreaming... and within this silence, your neurology continues to grow, to sprout, to develop into the better version of yourself that you have already become."}, {"id": "171", "pattern": "Situation-proof command", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Within every event, within every situation, within every trial... you will find these powers automatically available to you, strengthening you, guarding you, and giving you what you need."}, {"id": "172", "pattern": "Biological feedback loop", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "As long as your heart beats, as long as you breathe, these sensations flow from me to you, doubling and redoubling every single time you take a breath."}, {"id": "173", "pattern": "The release command", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Let it go. Let it be heavy, released, and relaxed. Effortless. You are dropping the weight, you are shedding the old, becoming soft and malleable."}, {"id": "174", "pattern": "The authority command", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "No matter how deep you go, you hear my voice. It is the voice that guides you. You understand that everything I say is for your absolute benefit. You are getting the experience you want, exactly as you want it."}, {"id": "175", "pattern": "Compounding synonyms", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Releasing. Letting go. Relaxing. Everything is released, everything is loose, everything is calm, everything is heavy. Spreading through every organ, every fiber, in every single direction."}, {"id": "176", "pattern": "Future pacing loop", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "This process will continue to improve your life, automatically, naturally, and permanently. It is already set, and it is already running."}, {"id": "177", "pattern": "The system reset", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "This is a total system reboot. Reprocessing, reorganizing, and resolving. Dissolved from the body, resolved from the mind, for all the right reasons."}, {"id": "178", "pattern": "Efficiency command", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "It happens in the fastest, easiest, and most efficient way. Automatically, intuitively, instinctively. An eternal, infinite, perpetual change."}, {"id": "179", "pattern": "The observer loop", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "No need to measure it, no need to manage it. Just observe the process as it runs on its own, according to your own inner principles and your own perfect pace."}, {"id": "180", "pattern": "The formula for creating reality", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Want it to happen... expect it to happen... and allow it to happen... now. Let it happen through the body, through the mind, simply allow it to be."}, {"id": "181", "pattern": "The \"Locked In\" Command", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "When you know you’ve got it, when you know it’s locked in so fully and completely that it’s impossible to turn off... you try to turn it off, and you notice what happens instead, and you realize you’re stuck being awesome."}, {"id": "182", "pattern": "Exponential growth", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "It just keeps getting stronger and stronger and stronger. Every time you think about it, it doubles and doubles and doubles in size, strength, force, and magnitude."}, {"id": "183", "pattern": "Future pacing integration", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "As you look back from one week, one month, six months into the future... you notice how these changes have continued to grow, stronger, more powerful, and more pervasive in every way."}, {"id": "184", "pattern": "The Metamorphosis", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Emerging from this process like a butterfly emerging from the cocoon... one phase of your metamorphosis complete, the next phase, the best phase, just getting started."}, {"id": "185", "pattern": "Neurological Overwriting", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "With each repetition, you make it ten times stronger, a hundred times more powerful... until it overwrites and replaces every old experience you've ever had."}, {"id": "186", "pattern": "The inner guide", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "You have a voice inside that reminds you, teaches you, and advises you. A voice that rings ten times louder than any other voice, drowning out every doubt, telling you all the things you most need to hear."}, {"id": "187", "pattern": "Dissolving and resolving", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "As you feel it, you reveal it; as you reveal it, you heal it. It is all dissolved and resolved from the body, dissolved and resolved from the mind, for all the right reasons."}, {"id": "188", "pattern": "The Unstoppable Drive", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "You have acquired the skills, you have tested the results, and now you have an unstoppable drive to get everything you want, the way you want it, by your standards and your definitions."}, {"id": "189", "pattern": "The Womb of Eternity", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "You find yourself in that place beyond time and space, that place where anything you can intend, anything you can act out, must become your reality in every way."}, {"id": "190", "pattern": "The Future You", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "You see the world through her eyes, hear the world, feel the world, free to be who you want, in every way you want, for all the right reasons."}, {"id": "191", "pattern": "The Nervous System Reset", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "While you sleep and while you dream, your nervous system, mind, body, and soul will take all the lessons, integrating them into new neurological connections."}, {"id": "192", "pattern": "Superhuman potential", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "Tapping into that amazing power within you to control reality, starting with your own. Becoming more fully human in the very best sense of the word."}, {"id": "193", "pattern": "The Gift of Autonomy", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "My gift to you is the ability to control your life in any way you want, for as long as you want, with whomever you want. You have the power, you have the control."}, {"id": "194", "pattern": "Instant Integration", "category": "Empowerment and Integration Statements", "color": "#a78bfa", "variations": {}, "staticContent": "All of my suggestions are now ten times more powerful, ten times more permanent, locked into that part of your neurology that most wants, desires, and facilitates these transformations."}, {"id": "195", "pattern": "Floating on a cloud", "category": "Deepeners", "color": "#38bdf8", "variations": {}, "staticContent": "Imagine that you are lying on a fluffy, white cloud. A very soft, very pleasant cloud. And you are floating on a cloud, and it is very safe, and very protected. Hovering in the sky... feeling yourself light and released... notice how the cloud adjusts itself to you perfectly, and above you the sky is blue and beautiful... very high... an endless sky... the sun is shining on you. See how beautiful everything is, beautiful blue skies, full of beautiful white clouds floating around you. The sun is pleasant and warming. Feel its warmth on you. This is the most relaxing place you have ever been in your life. Feel how the cloud fits itself to your body perfectly. And in a moment I want you to feel the cloud starting to land down to the earth, very safely and very slowly. Starting to go down. As I count from 10 to 1 you will feel the cloud going down towards the ground, taking you deeper and deeper, to a wondrous relaxation."}, {"id": "196", "pattern": "Descending stairs", "category": "Deepeners", "color": "#38bdf8", "variations": {}, "staticContent": "I want you to imagine that you are standing right now at the top of a flight of stairs... looking at them going down, down... these are very special stairs... notice that to your left there is an antique wooden handrail that you can rest your hand on... and for some unknown reason you feel that way down at the bottom of the stairs is the most peaceful and calm space... in fact, you know that with every step you go down you will be able to feel serenity and calm filling your entire being... body, mind, soul... as you look at the stairs you see how they spiral down, down... and I want you to take a first step now... a confident step... feeling serenity penetrating you from the sole of your foot... and another step... and I am going to count from 10 to 1 and with every number you go down another step, and another step... and with every step sinking more and more into the magical serenity..."}, {"id": "197", "pattern": "Magical fog", "category": "Deepeners", "color": "#38bdf8", "variations": {}, "staticContent": "I want you to imagine right now that there is a cloud of fog on the ceiling... it's a very thick and magical cloud... it's a very enchanted and special fog... this fog can penetrate into your body and calm all the pressure and all the tension that exist in you... in the body, in the mind, in the being... it's a magical fog that penetrates into all the cracks... into all the cells... into all the particles within you and into all the spaces between them... see this fog starting to descend along the walls now... coming down and getting closer to you... already feeling how you are relaxing and opening up to it... and feel it covering you like a blanket now... and slowly slowly passing through you... relaxing muscle after muscle, organ after organ... washing away from you everything that is unnecessary... feel it passing through you as I count from 10 to 1..."}, {"id": "198", "pattern": "Lake", "category": "Deepeners", "color": "#38bdf8", "variations": {}, "staticContent": "And I want you to imagine that you are walking right now in green and relaxing nature... everything is so peaceful and beautiful... the sky is high above you and you can hear birds chirping among the trees... and you are walking towards the shore of a clear, blue and beautiful lake... you see the small ripples of the water kissing the earth... you know that this is very special and pure water... dipping in this water washes away from you all the burden, all the tension, and all the pressure... so you decide to go in... step after step feeling the water cleansing you... walking confidently into the pleasant, relaxing water... until you can float entirely in wonderful quiet and without effort... letting the sweet water carry you... and in a moment I will count from 10 to 1 and with every number you will feel yourself sinking into the wondrous quiet of the water... into a wonderful and absolute quiet..."}, {"id": "199", "pattern": "Beach", "category": "Deepeners", "color": "#38bdf8", "variations": {}, "staticContent": "I want you to imagine that you are right now on a beautiful beach... you are walking barefoot on the yellow sand... it's a very beautiful and pleasant day... seeing the blue sea stretching to the horizon... the waves crashing on the sand leaving white foam... and you are walking on the pleasant sand... feeling it between your toes like it's massaging your feet... the blue sea, the yellow sand, the white foam, everything is so perfect. The pleasant sunbeams are relaxing and a pleasant breeze is blowing and caressing you... everything is so perfect... you lie down on a soft towel and the sand receives your body precisely... and with every wave you hear crashing on the shore you feel a wave of relaxation spreading inside you... wave after wave... of quiet... of serenity... of calmness... there is no end to the waves... there is no end to the depth of the serenity spreading in you now - 10... a wave crashing on the shore... 9... more and more relaxed... 8... sinking more and more... 7..."}, {"id": "200", "pattern": "Champagne bubbles", "category": "Deepeners", "color": "#38bdf8", "variations": {}, "staticContent": "I assume you like drinking champagne... and I want you to imagine that you are holding a cold glass of champagne right now... and really look into the glass... you can see the golden bubbles floating upwards... watching how they climb gently on the cold glass... and it is so beautiful and so mesmerizing... and I want you now to feel your feet... and I want you to imagine that your feet are filling up with the golden bubbles of the champagne... and these golden bubbles are so pleasant and relaxing... they dissolve all the pressure from you and scatter a relaxing and pleasant feeling as they begin to slowly climb to your ankle... and from there rise to the calves... relaxing and caressing you from the inside... it's so pleasant to let these magical bubbles continue and rise along your leg, tickling and pleasuring you... feel how they continue and rise up your body... and every place they reach becomes calm, relaxed, serene, pleasant..."}, {"id": "201", "pattern": "Ray of light", "category": "Deepeners", "color": "#38bdf8", "variations": {}, "staticContent": "I want you to imagine right now a magical and special ray of light shining on you... it is a very pleasant and warm ray of light... its special light can penetrate your body, penetrate the muscles and tissues and even the cells and spaces between them, and dissolve from you any unnecessary tension... I want you to feel how this ray of light is focusing right now on your feet... illuminating and warming the feet... relaxing the tiny muscles... filling the feet with this special and magical light... and now the ray continues and moves to your ankles... relaxing... cleansing, purifying... feel it rising and shining into your calves... bringing healing and relaxing light to the knees as well... everywhere this healing light penetrates softens immediately... absorbing the healing and nourishment into it... and you fill up more and more with deep serenity as the ray continues and rises in the body now..."}, {"id": "202", "pattern": "Volume dial", "category": "Deepeners", "color": "#38bdf8", "variations": {}, "staticContent": "And I want you to imagine now that on the wall beside you there is a volume dial... this is your relaxation dial... right now it's on zero and it can be turned up to ten... but with every click of a number you turn up you feel the relaxation in you doubling and deepening twice as much... I want us to turn it now together and feel how with every number your relaxation doubles itself and you sink deeper into perfect relaxation... feel what happens as we turn it now... (1..2..3..4..5..) excellent... and I want now that only I will turn the dial so that you can let go completely all the way... really feel how you drop with every click I turn... deeper each time by five folds... feel what is happening now... (6..7..8..9..10..)"}], "categories": [{"name": "Action Accelerator", "color": "#a78bfa"}, {"name": "Anticipation Builder", "color": "#818cf8"}, {"name": "Presuppositions", "color": "#c084fc"}, {"name": "Directing Awareness", "color": "#f472b6"}, {"name": "Engaging the Imagination", "color": "#fb923c"}, {"name": "Language Softeners", "color": "#34d399"}, {"name": "Cause and Effect", "color": "#f59e0b"}, {"name": "Complex Equivalence", "color": "#fbbf24"}, {"name": "Spectrum of Necessity", "color": "#60a5fa"}, {"name": "Negation", "color": "#94a3b8"}, {"name": "Amplification", "color": "#f87171"}, {"name": "Addressing the Subconscious", "color": "#6ee7b7"}, {"name": "Triggers", "color": "#fb923c"}, {"name": "Convincers", "color": "#e879f9"}, {"name": "Pleasure Metaphors", "color": "#fb7185"}, {"name": "Empowerment and Integration Statements", "color": "#a78bfa"}, {"name": "Deepeners", "color": "#38bdf8"}], "category_info": {"Action Accelerator": {"pattern": "Action Accelerator", "description": "Uses strong, active verbs combined with immediacy words like \"now\", \"automatically\", or \"effortlessly\" to prompt the guided person to act or feel something in the present moment — without conscious deliberation. The goal is to bypass the analytical mind and trigger an immediate, involuntary response."}, "Anticipation Builder": {"pattern": "Anticipation Builder", "description": "Creates positive expectation in the guided person's mind for something about to happen. Uses sensory language and vivid imagery to paint a picture of the desired experience. The guided person begins to believe in — and therefore help create — the forthcoming sensation."}, "Presuppositions": {"pattern": "Presuppositions", "description": "Embeds assumptions into language so that the guided person accepts a premise without consciously evaluating it. The suggestion is wrapped inside a question or statement that takes the desired outcome for granted — reducing resistance by making the experience seem inevitable rather than imposed."}, "Directing Awareness": {"pattern": "Directing Awareness", "description": "Gently guides the guided person's attention toward a specific sensation, feeling, or experience. Rather than commanding, it uses phrases like \"notice\" or \"become aware of\" to invite focused presence. This anchors the suggestion to something real and immediate, making it feel natural and self-discovered."}, "Engaging the Imagination": {"pattern": "Engaging the Imagination", "description": "Activates the guided person's imaginative capacity to create vivid mental imagery. By using metaphors and sensory descriptions, the guide helps the guided person experience something as real and tangible — even if it begins as fantasy. The more detailed and immersive the image, the stronger the physical and emotional response."}, "Language Softeners": {"pattern": "Language Softeners", "description": "Transforms direct commands into gentle invitations, reducing resistance from the conscious mind. Words like \"maybe\", \"perhaps\", or \"if you'd like\" make the suggestion feel like a free choice rather than a demand — which paradoxically makes compliance more likely, because the guided person feels no pressure."}, "Cause and Effect": {"pattern": "Cause and Effect", "description": "Links two ideas or experiences with a logical cause-and-effect relationship, whether or not that relationship literally exists. The guided person's mind accepts the connection and begins to produce the desired outcome as a consequence of something already happening. Creates a self-reinforcing loop."}, "Complex Equivalence": {"pattern": "Complex Equivalence", "description": "Creates equivalence between two separate things, fusing them into one meaning. When the guided person does or experiences one thing, it automatically carries the meaning of another. This builds associative connections that feel natural and self-evident."}, "Spectrum of Necessity": {"pattern": "Spectrum of Necessity", "description": "Creates a sense of importance, urgency, or moral rightness around an experience or action. Words like \"must\", \"need\", or \"have to\" motivate the guided person to move toward the desired state by framing it as necessary, desirable, or deeply aligned with who they are."}, "Negation": {"pattern": "Negation", "description": "Suggests an idea by appearing to deny it. Because the mind must process the concept to understand its negation, the image or sensation still enters the unconscious — while the guided person's resistance remains low, since they aren't being \"told\" to do anything. A subtle and elegant pattern."}, "Amplification": {"pattern": "Amplification", "description": "Intensifies and expands a sensation or experience that is already present. Uses metaphors of movement, volume, or scale — like a dial turning up, steps descending, or a wave growing — to guide the guided person toward increasingly deeper or stronger states."}, "Addressing the Subconscious": {"pattern": "Addressing the Subconscious", "description": "Communicates directly with the guided person's unconscious mind, bypassing rational filtering. By naming the unconscious as a separate, autonomous part, the guide grants it permission to produce involuntary responses — while the conscious mind observes or rests. Creates a sense of duality that deepens trance."}, "Empowerment and Integration Statements": {"pattern": "Empowerment and Integration Statements", "description": "Affirms the guided person's inner strength, wholeness, and capacity. Used to close a session or anchor a positive experience, these statements help integrate what was felt during trance into the guided person's self-concept — so the experience lives on beyond the session itself."}, "Deepeners": {"pattern": "Deepeners", "description": "Techniques designed to move the guided person from a light trance into a progressively deeper state of relaxation and focus. Typically uses a metaphor of downward or inward movement — stairs, a lift, a wave — combined with counting or breathing to create a felt sense of sinking deeper with each repetition."}, "Convincers": {"pattern": "Convincers", "description": "Language patterns that help the guided person experience an involuntary physical response — like a hand becoming heavy, a finger twitching, or an arm rising — which convinces both of them that the trance is working. The felt evidence of the unconscious responding builds trust and deepens the experience."}, "Triggers": {"pattern": "Triggers", "description": "Creates anchors — conditioned associations between a specific word, sound, or gesture and a particular sensation or state. Once the anchor is established during trance, using the trigger word instantly re-activates that feeling. Requires building the sensation fully first, then attaching the word to it at peak intensity."}, "Pleasure Metaphors": {"pattern": "Pleasure Metaphors", "description": "Rich, sensory metaphors drawn from the elements — air, fire, water, earth — and from charged emotional states like longing, surrender, and ecstasy. These words are woven into the trance narrative to evoke embodied, visceral experiences. They work below the level of rational processing to awaken sensation directly."}}};

        const THEME_ORDER = ['Freedom','Joy','Mischief','Playfulness','Safety & Trust','Relaxation','Pleasure','Desire','Sexy','Wildness'];
        const DEFAULT_EXCLUDED_CATEGORIES = ['Deepeners', 'Convincers', 'Triggers', 'Pleasure Metaphors'];

        const AppState = {
            rawRows: [],          
            cards: [],            
            activeDeck: [],       
            categories: [],       
            themes: [],           
              
            currentIndex: 0,
            currentTheme: 'Relaxation',
            isFlipped: false,
            isRecording: false,
              
            favorites: JSON.parse(localStorage.getItem('en_favorites_v1')) || [],
            recordings: JSON.parse(localStorage.getItem('en_recordings_v1')) || [],
              
            selectedCategories: []
        };

        // --- 2. The Parsing Engine ---
        function processCSV(data) {
            const cleanData = data.map(row => {
                const newRow = {};
                Object.keys(row).forEach(k => newRow[k.trim()] = row[k]);
                return newRow;
            });

            // Separate CATEGORY_INFO rows from card rows
            const categoryInfoRows = cleanData.filter(r => r.ID === 'CATEGORY_INFO');
            const cardRows = cleanData.filter(r => r.ID !== 'CATEGORY_INFO');

            // Build CATEGORY_INFO lookup from CSV data
            // Columns: ID=CATEGORY_INFO, Category=name, Pattern=PatternLabel, Content=Description
            CATEGORY_INFO = {};
            categoryInfoRows.forEach(r => {
                const cat = (r.Category || '').trim();
                if (cat) {
                    CATEGORY_INFO[cat] = {
                        pattern: (r.Pattern || '').trim(),
                        description: (r.Content || '').trim()
                    };
                }
            });

            AppState.rawRows = cardRows;

            // Extract Unique Themes
            const themesSet = new Set();
            const skipThemes = new Set(['Dynamic', 'Static', 'General', '']);
            cleanData.forEach(row => {
                if (row.Theme && row.Theme.trim().length > 1 && !skipThemes.has(row.Theme.trim()))
                    themesSet.add(row.Theme.trim());
            });
            AppState.themes = THEME_ORDER.filter(t => themesSet.has(t));
            // Add any themes from CSV not in our order list
            themesSet.forEach(t => { if (!AppState.themes.includes(t)) AppState.themes.push(t); });
            if (AppState.themes.length === 0) AppState.themes = [...THEME_ORDER];

            // Extract Categories
            const catsMap = new Map();
            cleanData.forEach(row => {
                const catName = row.Category ? row.Category.trim() : 'General';
                if (!catsMap.has(catName)) {
                    catsMap.set(catName, row.Color || '#A0A0A0');
                }
            });
            AppState.categories = Array.from(catsMap).map(([name, color]) => ({name, color}));

            // Aggregation Logic — group by Pattern, variations by Theme
            const cardsMap = new Map();
            
            cleanData.forEach(row => {
                const pattern = row.Pattern ? row.Pattern.trim() : null;
                if (!pattern) return;

                const mapKey = pattern;

                if (!cardsMap.has(mapKey)) {
                    cardsMap.set(mapKey, {
                        id: row.ID,   
                        pattern: pattern,
                        category: row.Category || 'General',
                        color: row.Color || catsMap.get(row.Category) || '#fff',
                        variations: {},   
                        staticContent: null
                    });
                }

                const card = cardsMap.get(mapKey);
                const theme = row.Theme ? row.Theme.trim() : 'General';
                const content = row.Content;

                if (theme === 'General' || theme === 'Dynamic' || theme === 'Static' || !theme) {
                    card.staticContent = card.staticContent ? card.staticContent + "<br><br>" + content : content;
                } else {
                    if (card.variations[theme]) {
                        card.variations[theme] += "<br><br>" + content;
                    } else {
                        card.variations[theme] = content;
                    }
                }
            });

            AppState.cards = Array.from(cardsMap.values());
              
            try {
                localStorage.setItem('en_cards_data_v1', JSON.stringify(AppState.cards));
                localStorage.setItem('en_themes_data_v1', JSON.stringify(AppState.themes));
                localStorage.setItem('en_cats_data_v1', JSON.stringify(AppState.categories));
            } catch (e) { console.warn("Storage quota exceeded"); }

            alert(`Loaded successfully!\n${AppState.cards.length} unique patterns detected.`);
            renderModeSelect();
        }


        function loadEmbeddedData() {
            // Use embedded data (no CSV needed)
            AppState.cards = EMBEDDED_DATA.cards;
            AppState.categories = EMBEDDED_DATA.categories;
            CATEGORY_INFO = EMBEDDED_DATA.category_info;
            AppState.themes = THEME_ORDER.slice();
        }

        function loadFromStorage() {
            const savedCards = localStorage.getItem('en_cards_data_v1');
            if (savedCards) {
                try {
                    AppState.cards = JSON.parse(savedCards);
                    const savedThemes = JSON.parse(localStorage.getItem('en_themes_data_v1') || '[]');
                    // Always apply fixed order
                    AppState.themes = THEME_ORDER.filter(t => savedThemes.includes(t));
                    savedThemes.forEach(t => { if (!AppState.themes.includes(t)) AppState.themes.push(t); });
                    if (AppState.themes.length === 0) AppState.themes = [...THEME_ORDER];
                    AppState.categories = JSON.parse(localStorage.getItem('en_cats_data_v1') || '[]');
                    return true;
                } catch(e) { return false; }
            }
            return false;
        }

        // --- 3. Core Logic Helpers ---

        function renderMarkdown(text) {
            if (!text) return '';
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        function startSession(mode) {
            if (mode === 'all') {
                AppState.activeDeck = AppState.cards
                    .filter(c => !DEFAULT_EXCLUDED_CATEGORIES.includes(c.category))
                    .sort(() => Math.random() - 0.5);
                  
                if (AppState.activeDeck.length === 0) {
                    AppState.activeDeck = [...AppState.cards].sort(() => Math.random() - 0.5);
                }

            } else if (mode === 'custom') {
                if (AppState.selectedCategories.length === 0) return alert("Please select at least one category.");
                AppState.activeDeck = AppState.cards
                    .filter(c => AppState.selectedCategories.includes(c.category))
                    .sort(() => Math.random() - 0.5);
            }
              
            if (AppState.activeDeck.length === 0) return alert("No cards found for this selection.");
              
            AppState.currentIndex = 0;
            AppState.isFlipped = false;
            AppState.currentTheme = 'Relaxation';
              
            document.getElementById('app').innerHTML = '';
            renderPlayer();
        }

        function getCurrentCard() {
            return AppState.activeDeck[AppState.currentIndex];
        }

        function getCardContent(card, theme) {
            if (card.variations && card.variations[theme]) return card.variations[theme];
            if (card.variations && card.variations['Relaxation']) return card.variations['Relaxation'];
            if (card.staticContent) return card.staticContent;
            const keys = Object.keys(card.variations);
            if (keys.length > 0) return card.variations[keys[0]];
            return "No content found for this theme.";
        }

        // --- Theme strip (arrow navigation, infinite wrap) ---
        let themeOffset = 0; // how many steps shifted from center

        function buildThemeStrip(card) {
            const strip = document.getElementById('themeStrip');
            if (!strip) return;
            const themes = AppState.themes;
            const n = themes.length;
            const activeIdx = themes.indexOf(AppState.currentTheme);

            strip.innerHTML = '';

            // Show prev, active, next — always 3 items, active in center
            [-1, 0, 1].forEach(offset => {
                const idx = ((activeIdx + offset) % n + n) % n;
                const t = themes[idx];
                const isActive = offset === 0;

                const div = document.createElement('div');
                div.className = 'carousel-item' + (isActive ? ' active' : '');
                div.dataset.theme = t;
                div.textContent = t;
                div.onclick = () => setTheme(t);

                if (isActive && card) {
                    div.style.borderColor = card.color;
                    div.style.color = card.color;
                    div.style.backgroundColor = 'rgba(255,255,255,0.08)';
                    div.style.boxShadow = `0 0 12px ${card.color}40`;
                    div.style.opacity = '1';
                    div.style.transform = 'scale(1.08)';
                    div.style.fontWeight = 'bold';
                }

                strip.appendChild(div);
            });
        }

        function shiftTheme(dir) {
            const themes = AppState.themes;
            const n = themes.length;
            const activeIdx = themes.indexOf(AppState.currentTheme);
            const newIdx = ((activeIdx + dir) % n + n) % n;
            setTheme(themes[newIdx]);
        }

            const card = getCurrentCard();

            if (idx > -1) AppState.favorites.splice(idx, 1);

            localStorage.setItem('en_favorites_v1', JSON.stringify(AppState.favorites));

        let mediaRecorder = null;
        let audioChunks = [];

        function toggleRecording() {
            AppState.isRecording = !AppState.isRecording;
            const btn = document.getElementById('recordBtn');

            if (AppState.isRecording) {
                // Start recording
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        audioChunks = [];
                        mediaRecorder = new MediaRecorder(stream);
                        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                        mediaRecorder.start();

                        btn.classList.remove('bg-purple-600', 'text-white', 'shadow-[0_0_20px_rgba(147,51,234,0.3)]');
                        btn.classList.add('recording-pulse', 'bg-red-500/10', 'border', 'border-red-500');
                        btn.innerHTML = '<i data-lucide="square"></i>';
                        lucide.createIcons();
                    })
                    .catch(() => {
                        AppState.isRecording = false;
                        alert('Microphone access denied. Please allow microphone access and try again.');
                    });

            } else {
                // Stop and download
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const now = new Date();
                        const pad = n => String(n).padStart(2, '0');
                        const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
                        const timeStr = `${pad(now.getHours())}-${pad(now.getMinutes())}`;
                        const filename = `Hypnotic-Language-Practice_${dateStr}_${timeStr}.webm`;

                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename;
                        a.click();
                        URL.revokeObjectURL(url);

                        // Save metadata to archive
                        const card = getCurrentCard();
                        AppState.recordings.unshift({
                            id: Date.now(),
                            name: filename,
                            date: `${dateStr} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
                            pattern: card.pattern,
                            theme: AppState.currentTheme
                        });
                        localStorage.setItem('en_recordings_v1', JSON.stringify(AppState.recordings));

                        // Stop all tracks
                        mediaRecorder.stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.stop();
                }

                btn.classList.add('bg-purple-600', 'text-white', 'shadow-[0_0_20px_rgba(147,51,234,0.3)]');
                btn.classList.remove('recording-pulse', 'bg-red-500/10', 'border', 'border-red-500');
                btn.innerHTML = '<i data-lucide="mic"></i>';
                lucide.createIcons();
            }
        }

        function clearData() {
            if (confirm('This will delete all data including favorites and recordings.\nContinue?')) {
                localStorage.clear();
                location.reload();
            }
        }

        renderWelcome();

    </script>
</body>
</html>
